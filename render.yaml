services:
  - type: web
    name: nagarmitra
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: FLASK_DEBUG
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
    disk:
      name: nagarmitra-data
      mountPath: /var/data
      sizeGB: 1
