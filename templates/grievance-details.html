<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grievance Details — NagarMitra</title>
  <meta name="description" content="View full grievance details, status history, and evidence on NagarMitra."/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    .detail-layout { display:grid; grid-template-columns:3fr 2fr; gap:2rem; align-items:start; }
    @media(max-width:900px) { .detail-layout { grid-template-columns:1fr; } }
    #grievance-map { height:260px; }
    .evidence-img {
      max-width:100%; border-radius:var(--radius-sm);
      margin-top:.5rem; cursor:pointer;
      transition:transform var(--transition);
    }
    .evidence-img:hover { transform:scale(1.02); }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-brand"><div class="logo-icon">NM</div><span class="brand-name">NagarMitra</span></a>
  <button class="hamburger" id="hamburger-btn"><span></span><span></span><span></span></button>
  <ul class="nav-links" id="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/track">Track</a></li>
    <li><a href="/dashboard">Dashboard</a></li>
    <li><a href="/campaigns">Campaigns</a></li>
    <li><a href="/departments">Departments</a></li>
    <li><a href="/feedback">Feedback</a></li>
  </ul>
  <div class="nav-actions">
    <div id="nav-user-info"></div>
    <a href="/report-grievance" class="btn btn-accent btn-sm" id="nav-report-btn" style="display:none">+ Report</a>
    <a href="/login" class="btn btn-primary btn-sm" id="nav-login-btn">Login</a>
    <button class="btn btn-ghost btn-sm" id="nav-logout-btn" style="display:none">Logout</button>
  </div>
</nav>

<div class="page-header" id="page-header">
  <div class="container">
    <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
      <a href="/dashboard" style="color:rgba(255,255,255,.7);font-size:.85rem">← Dashboard</a>
      <span style="color:rgba(255,255,255,.4)">/</span>
      <span style="color:#fff;font-size:.85rem" id="header-id">Loading…</span>
    </div>
    <h1 id="header-title" style="margin-top:.5rem">Loading Grievance…</h1>
  </div>
</div>

<section class="section">
  <div class="container" id="main-content">
    <div class="card"><div class="card-body text-center" style="padding:3rem">
      <div class="spinner" style="margin:0 auto"></div>
      <p class="text-muted mt-2">Loading grievance details…</p>
    </div></div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/js/main.js"></script>
<script>
const grievanceId = new URLSearchParams(location.search).get('id');
let currentUser = null;
let grievanceData = null;

async function initPage() {
  currentUser = await Auth.loadUser();
  Nav.render();
  Nav.highlightActive();
  Nav.setupHamburger();

  if (!grievanceId) {
    document.getElementById('main-content').innerHTML = `
      <div class="alert alert-error">No grievance ID specified. <a href="/dashboard">Go to Dashboard</a></div>`;
    return;
  }
  loadGrievance();
}

async function loadGrievance() {
  const res = await API.get(`/api/grievances/${grievanceId}`);
  if (!res.ok) {
    document.getElementById('main-content').innerHTML = `
      <div class="alert alert-error">Grievance not found. <a href="/dashboard">Go to Dashboard</a></div>`;
    return;
  }
  grievanceData = res.data.grievance;
  const updates  = res.data.updates || [];
  const feedback = res.data.feedback || [];

  document.getElementById('header-id').textContent    = grievanceData.grievance_id;
  document.getElementById('header-title').textContent = grievanceData.title;

  renderDetails(grievanceData, updates, feedback);
}

function renderDetails(g, updates, feedback) {
  const isOffAdmin = currentUser && ['official','admin'].includes(currentUser.role);
  const isMine     = currentUser && currentUser.user_id === g.citizen_id;
  const canFeedback= isMine && g.status === 'Resolved' && !feedback.length;

  document.getElementById('main-content').innerHTML = `
    <div class="detail-layout">
      <!-- Left -->
      <div style="display:flex;flex-direction:column;gap:1.5rem">
        <!-- Main Info -->
        <div class="card">
          <div class="card-header">
            <div style="display:flex;flex-direction:column;gap:.4rem">
              <div style="display:flex;gap:.5rem;flex-wrap:wrap">
                ${statusBadge(g.status)}
                ${priorityBadge(g.priority)}
                <span class="badge" style="background:var(--bg);color:var(--text-secondary)">${categoryIcon(g.category)} ${g.category}</span>
              </div>
            </div>
            ${isOffAdmin ? `<button class="btn btn-primary btn-sm" onclick="openStatusUpdate()">Update Status</button>` : ''}
          </div>
          <div class="card-body">
            <p style="font-size:1rem;line-height:1.7;color:var(--text-primary)">${g.description}</p>
            <div style="display:flex;flex-wrap:wrap;gap:1.5rem;margin-top:1.25rem;font-size:.85rem;color:var(--text-muted)">
              <div><strong style="color:var(--text-secondary)">Filed On</strong><br/>${formatDateTime(g.created_at)}</div>
              <div><strong style="color:var(--text-secondary)">Last Updated</strong><br/>${formatDateTime(g.updated_at)}</div>
              ${g.resolved_at ? `<div><strong style="color:var(--success)">Resolved On</strong><br/>${formatDateTime(g.resolved_at)}</div>` : ''}
              ${g.location_text ? `<div><strong style="color:var(--text-secondary)">Location</strong><br/>📍 ${g.location_text}</div>` : ''}
            </div>
            ${g.image_path ? `
              <div style="margin-top:1.25rem">
                <strong class="text-sm" style="color:var(--text-secondary)">ATTACHED PHOTO</strong>
                <img src="/uploads/${g.image_path}" alt="Grievance photo" class="evidence-img" onclick="window.open('/uploads/${g.image_path}','_blank')"/>
              </div>` : ''}
          </div>
        </div>

        <!-- Updates Timeline -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">📅 Status History</span>
            <span class="badge badge-submitted">${updates.length} updates</span>
          </div>
          <div class="card-body">
            ${updates.length === 0 ? `<p class="text-muted text-sm">No updates yet.</p>` :
              `<div class="timeline">
                ${[...updates].reverse().map(u => `
                  <div class="timeline-item">
                    <div class="timeline-time">${formatDateTime(u.created_at)}</div>
                    <div class="timeline-content">
                      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.25rem">
                        ${u.previous_status ? `${statusBadge(u.previous_status)} <span style="color:var(--text-muted)">→</span>` : ''}
                        ${statusBadge(u.new_status)}
                      </div>
                      ${u.remarks ? `<p class="text-sm" style="margin-top:.35rem">${u.remarks}</p>` : ''}
                      ${u.evidence_path ? `
                        <div style="margin-top:.5rem">
                          <img src="/uploads/${u.evidence_path}" alt="Evidence" class="evidence-img" style="max-height:150px;object-fit:cover" onclick="window.open('/uploads/${u.evidence_path}','_blank')"/>
                        </div>` : ''}
                    </div>
                  </div>`).join('')}
              </div>`}
          </div>
        </div>

        <!-- Feedback -->
        ${canFeedback ? `
          <div class="card">
            <div class="card-header"><span class="card-title">⭐ Submit Feedback</span></div>
            <div class="card-body">
              <p class="text-sm text-muted mb-2">Rate the resolution of your grievance</p>
              <div class="star-rating" id="star-rating">
                ${[1,2,3,4,5].map(i => `<span class="star" data-val="${i}">★</span>`).join('')}
              </div>
              <input type="hidden" id="feedback-rating" value="0"/>
              <textarea id="feedback-comments" class="form-control mt-2" rows="3" placeholder="Optional comments…"></textarea>
              <button class="btn btn-accent btn-sm mt-2" onclick="submitFeedback('${g.grievance_id}')">Submit Feedback</button>
            </div>
          </div>` : ''}

        ${feedback.length ? `
          <div class="card">
            <div class="card-header"><span class="card-title">⭐ Citizen Feedback</span></div>
            <div class="card-body">
              ${feedback.map(f => `
                <div style="padding:.75rem 0;border-bottom:1px solid var(--border)">
                  <div style="color:#f59e0b;font-size:1.2rem">${'★'.repeat(+f.rating)}${'☆'.repeat(5-+f.rating)}</div>
                  ${f.comments ? `<p class="text-sm mt-1">${f.comments}</p>` : ''}
                  <div class="text-sm text-muted">${formatDate(f.created_at)}</div>
                </div>`).join('')}
            </div>
          </div>` : ''}
      </div>

      <!-- Right Sidebar -->
      <div style="display:flex;flex-direction:column;gap:1.5rem">
        <!-- Quick Info -->
        <div class="card">
          <div class="card-body">
            <div style="display:flex;flex-direction:column;gap:.85rem;font-size:.875rem">
              <div>
                <div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Grievance ID</div>
                <code style="font-size:.9rem;font-weight:700;color:var(--primary)">${g.grievance_id}</code>
              </div>
              <div>
                <div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Category</div>
                <div>${categoryIcon(g.category)} ${g.category}</div>
              </div>
              <div>
                <div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Department ID</div>
                <div>${g.department_id || 'Unassigned'}</div>
              </div>
              <div>
                <div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Status</div>
                ${statusBadge(g.status)}
              </div>
              <div>
                <div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Priority</div>
                ${priorityBadge(g.priority)}
              </div>
            </div>
          </div>
        </div>

        <!-- Map -->
        ${(g.latitude && g.longitude && parseFloat(g.latitude) && parseFloat(g.longitude)) ? `
          <div class="card">
            <div class="card-header"><span class="card-title">📍 Location</span></div>
            <div style="padding:.75rem">
              <div class="map-container">
                <div id="grievance-map"></div>
              </div>
            </div>
          </div>` : ''}

        <!-- Official actions -->
        ${isOffAdmin ? `
          <div class="card">
            <div class="card-body">
              <h4 style="font-weight:700;margin-bottom:.75rem">Official Actions</h4>
              <button class="btn btn-primary btn-block mb-1" onclick="openStatusUpdate()">📋 Update Status</button>
              ${currentUser.role === 'admin' ? `
                <button class="btn btn-outline btn-block" onclick="window.location='/dashboard'">🏛️ Assign Grievance</button>` : ''}
            </div>
          </div>` : ''}
      </div>
    </div>

    <!-- Status Update Inline (for officials) -->
    <div id="status-update-panel" style="display:none;margin-top:1.5rem">
      <div class="card card-elevated">
        <div class="card-header"><span class="card-title">Update Status</span></div>
        <div class="card-body">
          <div class="form-row form-row-2 mb-2">
            <div class="form-group">
              <label class="form-label">New Status</label>
              <select id="inline-status" class="form-control form-select">
                <option>Submitted</option><option>Under Review</option><option>Assigned</option>
                <option>In Progress</option><option>Resolved</option><option>Rejected</option>
              </select>
            </div>
          </div>
          <div class="form-group mb-2">
            <label class="form-label">Remarks</label>
            <textarea id="inline-remarks" class="form-control" rows="3" placeholder="Add progress notes…"></textarea>
          </div>
          <div style="display:flex;gap:.75rem">
            <button class="btn btn-primary" onclick="submitStatusUpdate('${g.grievance_id}')">Save Update</button>
            <button class="btn btn-ghost" onclick="document.getElementById('status-update-panel').style.display='none'">Cancel</button>
          </div>
        </div>
      </div>
    </div>`;

  // Init map if location available
  if (g.latitude && g.longitude && parseFloat(g.latitude) && parseFloat(g.longitude)) {
    setTimeout(() => {
      const m = L.map('grievance-map').setView([parseFloat(g.latitude), parseFloat(g.longitude)], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 19
      }).addTo(m);
      L.marker([parseFloat(g.latitude), parseFloat(g.longitude)], {
        icon: MapHelper.markerIcon(g.category, g.status)
      }).addTo(m).bindPopup(MapHelper.popupContent(g)).openPopup();
    }, 100);
  }

  // Star rating
  if (canFeedback) {
    initStarRating('#star-rating', 'feedback-rating');
  }
}

function openStatusUpdate() {
  const panel = document.getElementById('status-update-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (grievanceData) document.getElementById('inline-status').value = grievanceData.status;
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function submitStatusUpdate(gid) {
  const btn = document.querySelector('#status-update-panel .btn-primary');
  setLoading(btn, true);
  const res = await API.patch(`/api/grievances/${gid}/status`, {
    status:  document.getElementById('inline-status').value,
    remarks: document.getElementById('inline-remarks').value,
  });
  setLoading(btn, false);
  if (res.ok) { Toast.success('Status updated!'); loadGrievance(); document.getElementById('status-update-panel').style.display='none'; }
  else Toast.error(res.data.error || 'Update failed');
}

async function submitFeedback(gid) {
  const rating = parseInt(document.getElementById('feedback-rating').value);
  if (!rating || rating < 1 || rating > 5) { Toast.error('Please select a star rating.'); return; }
  const res = await API.post('/api/feedback', {
    grievance_id: gid,
    rating,
    comments: document.getElementById('feedback-comments').value.trim(),
  });
  if (res.ok) { Toast.success('Thank you for your feedback!'); loadGrievance(); }
  else Toast.error(res.data.error || 'Feedback submission failed');
}

initPage();
</script>
</body>
</html>
