<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page Not Found — NagarMitra</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">
<nav class="navbar">
  <a href="/" class="nav-brand"><div class="logo-icon">NM</div><span class="brand-name">NagarMitra</span></a>
</nav>
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:3rem">
  <div class="text-center">
    <div style="font-size:6rem;font-weight:800;font-family:'Poppins',sans-serif;
                background:linear-gradient(135deg,var(--primary),var(--accent));
                -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
                line-height:1;margin-bottom:1rem">404</div>
    <h1 style="font-size:1.5rem;font-weight:700;margin-bottom:.75rem">Page Not Found</h1>
    <p class="text-muted mb-3">The page you're looking for doesn't exist or has been moved.</p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
      <a href="/" class="btn btn-primary">Go Home</a>
      <a href="/dashboard" class="btn btn-outline">My Dashboard</a>
    </div>
  </div>
</div>
</body>
</html>
